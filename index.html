<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HealthDesk - School Clinic</title>

    <!-- PWA -->
    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#2e8b57"
    >

    <!-- iOS PWA -->
    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HealthDesk"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="top-header">

        <div class="header-logo">

            <img
                src="icon-192.png"
                alt="HealthDesk Logo"
            >

        </div>

        <div class="header-title">

            <h1>HEALTHDESK</h1>

            <p>School Clinic</p>

        </div>

        <!-- WEBSITE ONLY -->
        <button
            id="installBtn"
            class="install-btn"
            type="button"
        >
            📱 Download App
        </button>

    </header>


    <!-- ========================================
         LOGIN / SIGN UP
    ========================================= -->

    <main class="auth-container">

        <!-- LOGIN -->
        <section
            id="loginSection"
            class="auth-card"
        >

            <h2>Welcome Back</h2>

            <p>
                School Clinic Appointment System
            </p>

            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>

            </form>

            <p class="switch-text">

                Don't have an account?

                <button
                    type="button"
                    id="showSignup"
                    class="link-btn"
                >
                    Sign Up
                </button>

            </p>

            <a
                href="admin-login.html"
                class="admin-link"
            >
                Admin Login
            </a>

        </section>


        <!-- SIGN UP -->
        <section
            id="signupSection"
            class="auth-card hidden"
        >

            <h2>Create Account</h2>

            <p>
                Register for HealthDesk
            </p>

            <form id="signupForm">

                <label for="signupName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="signupStudentId">
                    Student ID
                </label>

                <input
                    type="text"
                    id="signupStudentId"
                    placeholder="Enter your student ID"
                    required
                >

                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >

                <button
                    type="submit"
                    class="auth-btn"
                >
                    Sign Up
                </button>

            </form>

            <p class="switch-text">

                Already have an account?

                <button
                    type="button"
                    id="showLogin"
                    class="link-btn"
                >
                    Login
                </button>

            </p>

        </section>

    </main>


    <!-- ========================================
         PWA INSTALL LOADING SCREEN
    ========================================= -->

    <div
        id="downloadOverlay"
        class="download-overlay"
    >

        <div class="download-box">

            <div class="download-spinner"></div>

            <h2>
                Preparing HealthDesk
            </h2>

            <p id="downloadMessage">
                Preparing the app for installation...
            </p>

            <!-- PROGRESS BAR -->
            <div class="download-progress">

                <div
                    id="downloadProgressBar"
                    class="download-progress-bar"
                ></div>

            </div>

            <!-- COUNTDOWN -->
            <p
                id="downloadCountdown"
                class="download-countdown"
            >
                15 seconds
            </p>

            <!-- SHOWS AFTER 15 SECONDS -->
            <button
                id="installNowBtn"
                class="install-now-btn"
                type="button"
                style="display: none;"
            >
                📱 Install HealthDesk
            </button>

        </div>

    </div>


    <!-- ========================================
         FOOTER
    ========================================= -->

    <footer>

        <p>
            © 2026 HealthDesk - School Clinic
        </p>

    </footer>


    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="script.js"></script>


    <!-- ========================================
         SERVICE WORKER
    ========================================= -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register("./service-worker.js")

                        .then(function (registration) {

                            console.log(
                                "HealthDesk Service Worker registered:",
                                registration.scope
                            );

                        })

                        .catch(function (error) {

                            console.error(
                                "Service Worker registration failed:",
                                error
                            );

                        });

                }
            );

        }

    </script>

</body>

</html>
